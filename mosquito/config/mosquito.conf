# Simplified Mosquitto Config for local debugging
allow_anonymous true

# Standard TCP
listener 1883

# WebSockets for Dashboard
listener 8083
protocol websockets

# mTLS Listener (config kept but require_cert disabled for debugging)
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key
require_certificate false
